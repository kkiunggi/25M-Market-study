<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>25M Markets</title><style>:root{color-scheme:dark;--bg:#090d11;--p:#121920;--b:#29343e;--a:#b8ff5d;--m:#8e9aa5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7f9;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1280px;margin:auto;padding:28px}h1{font-size:34px;margin:0 0 5px}h1 b{color:var(--a)}.sub{color:var(--m);font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.btn{background:var(--a);color:#10150e;border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.card,.panel{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:14px}.card{cursor:pointer}.card:hover{border-color:var(--a)}.name{font-weight:850}.note,.src{font-size:10px;color:var(--m)}.val{font-size:24px;font-weight:900;margin:14px 0 3px}.chg{font-size:11px}.up{color:#ff858c}.down{color:#76c9ff}.section{margin-top:25px}.section h2{font-size:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.news{display:grid;gap:8px;max-height:520px;overflow:auto}.item{padding:10px;background:#182028;border-radius:9px}.item a{color:#e8ffd0;text-decoration:none;font-size:12px}.detail{margin-top:12px;display:none}.detail.show{display:block}.chart{height:280px}.chart svg{width:100%;height:100%}.line{fill:none;stroke:var(--a);stroke-width:2}.area{fill:#b8ff5d12}textarea{width:100%;min-height:70px;background:#0b1116;color:white;border:1px solid var(--b);border-radius:8px;padding:9px;margin:5px 0 10px}.feedback{white-space:pre-wrap;font-size:12px;line-height:1.55;margin-top:10px}.journal{margin-top:10px;display:grid;gap:8px}.entry{background:#182028;border-radius:9px;padding:10px;font-size:11px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><div class="wrap"><div class="top"><div><h1>25M <b>MARKETS</b></h1><div class="sub">25-minute S&T macro training desk</div></div><button class="btn" id="refresh">↻ Refresh</button></div><div id="status" class="sub">시장 데이터 연결 중…</div><div id="grid" class="grid section"></div><div id="detail" class="panel detail"><div id="dtitle" class="name"></div><div id="dval" class="val"></div><div id="chart" class="chart"></div></div><div class="two section"><section><h2>Live News Radar</h2><div class="panel"><div id="news" class="news">뉴스 연결 중…</div></div></section><section><h2>Cause → Price</h2><div class="panel"><div class="src">① Event / Surprise</div><textarea id="event"></textarea><div class="src">② Market expectation / pricing</div><textarea id="expectation"></textarea><div class="src">③ Asset reaction</div><textarea id="reaction"></textarea><div class="src">④ Why / My reasoning</div><textarea id="reasoning"></textarea><div class="src">⑤ My View / Next catalyst</div><textarea id="view"></textarea><button class="btn" id="ai">AI 피드백 받기</button><button class="btn" id="save" style="margin-left:6px">Journal 저장</button><div id="feedback" class="feedback"></div></div></section></div><section class="section"><h2>Market Journal</h2><div id="journal" class="journal"></div></section></div><script>const $=s=>document.querySelector(s);let items=[];const esc=s=>String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));function fmt(x){return Number(x).toLocaleString('en-US',{maximumFractionDigits:2})}async function markets(){try{let r=await fetch('/api/markets'),j=await r.json();items=j.items;$('#status').textContent=`${items.filter(x=>x.ok).length}/${items.length} sources connected · ${new Date(j.updatedAt).toLocaleTimeString()}`;$('#grid').innerHTML=items.map(x=>`<div class="card" data-id="${x.id}"><div class="name">${x.label}</div><div class="note">${x.note} · ${x.source}</div><div class="val">${x.ok?(x.unit==='$'?'$':'')+fmt(x.value)+(x.unit==='%'?'%':''):'—'}</div><div class="chg ${x.pct>0?'up':'down'}">${x.ok?(x.pct>0?'+':'')+x.pct.toFixed(2)+'%':'연결 실패'}</div></div>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>detail(c.dataset.id))}catch(e){$('#status').textContent='시장 데이터 연결 실패: '+e.message}}function detail(id){let a=items.find(x=>x.id===id);if(!a)return;$('#detail').classList.add('show');$('#dtitle').textContent=a.label+' · '+a.note;$('#dval').textContent=a.ok?fmt(a.value)+(a.unit==='%'?'%':''):'—';let d=(a.series||[]).slice(-120);if(d.length<2){$('#chart').innerHTML='시계열 없음';return}let w=900,h=280,min=Math.min(...d.map(x=>x.v)),max=Math.max(...d.map(x=>x.v)),rg=max-min||1,p=d.map((x,i)=>({x:i/(d.length-1)*w,y:10+(h-30)*(1-(x.v-min)/rg)})),path=p.map((q,i)=>(i?'L':'M')+q.x+','+q.y).join(' ');$('#chart').innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path class="area" d="${path} L${w},${h} L0,${h}Z"/><path class="line" d="${path}"/></svg>`;news(a.label)}async function news(q=''){try{let r=await fetch('/api/news'+(q?'?asset='+encodeURIComponent(q):'')),j=await r.json();if(!j.ok)throw Error(j.error);$('#news').innerHTML=(j.articles||[]).map(x=>`<div class="item"><a target="_blank" rel="noreferrer" href="${esc(x.url)}">${esc(x.title)}</a><div class="src">${esc(x.source)} · ${esc(x.date)}</div></div>`).join('')||'뉴스 없음'}catch(e){$('#news').textContent='뉴스 연결 실패: '+e.message}}function snapshot(){return items.filter(x=>x.ok).map(x=>`${x.label}: ${x.value} (${x.pct.toFixed(2)}%)`).join('\n')}$('#ai').onclick=async()=>{$('#feedback').textContent='피드백 생성 중…';try{let body={event:$('#event').value,expectation:$('#expectation').value,reaction:$('#reaction').value,reasoning:$('#reasoning').value,view:$('#view').value,snapshot:snapshot()},r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!j.ok)throw Error(j.error);$('#feedback').textContent=j.text}catch(e){$('#feedback').textContent='AI 연결 필요: '+e.message}};function loadJournal(){let a=JSON.parse(localStorage.getItem('25m-journal')||'[]');$('#journal').innerHTML=a.map(x=>`<div class="entry"><b>${esc(x.date)}</b><br>${esc(x.event)}<br><span class="src">${esc(x.reasoning)}</span></div>`).join('')||'<div class="sub">아직 저장된 기록이 없습니다.</div>'}$('#save').onclick=()=>{let a=JSON.parse(localStorage.getItem('25m-journal')||'[]');a.unshift({date:new Date().toLocaleString(),event:$('#event').value,reasoning:$('#reasoning').value});localStorage.setItem('25m-journal',JSON.stringify(a));loadJournal()};$('#refresh').onclick=()=>{markets();news()};markets();news();loadJournal();</script></body></html>
