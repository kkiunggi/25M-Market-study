<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>25M Markets</title><style>:root{color-scheme:dark;--bg:#090d11;--p:#121920;--p2:#182028;--b:#29343e;--a:#b8ff5d;--m:#8e9aa5;--up:#ff858c;--down:#76c9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7f9;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1320px;margin:auto;padding:28px}h1{font-size:34px;margin:0 0 5px}h1 b{color:var(--a)}h2{font-size:18px}.sub,.src{color:var(--m);font-size:11px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.btn{background:var(--a);color:#10150e;border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.secondary{background:transparent;color:#f4f7f9;border:1px solid var(--b)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.card,.panel{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:14px}.card{cursor:pointer;text-align:left;color:inherit}.card:hover,.card.selected{border-color:var(--a)}.name{font-weight:850}.note{font-size:10px;color:var(--m)}.val{font-size:24px;font-weight:900;margin:14px 0 3px}.chg{font-size:11px}.up{color:var(--up)}.down{color:var(--down)}.section{margin-top:25px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.news{display:grid;gap:8px;max-height:540px;overflow:auto}.item{padding:11px;background:var(--p2);border-radius:9px}.item a{color:#e8ffd0;text-decoration:none;font-size:12px;line-height:1.4}.detail{margin-top:12px;display:none}.detail.show{display:block}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stat{background:var(--p2);border-radius:8px;padding:9px}.stat b{display:block;font-size:14px}.chart-wrap{position:relative;background:#0d1318;border:1px solid var(--b);border-radius:10px;padding:8px}.chart{height:330px}.chart svg{width:100%;height:100%}.line{fill:none;stroke:var(--a);stroke-width:2}.area{fill:#b8ff5d12}.gridline{stroke:#26323c;stroke-width:1}.axis{fill:#93a0ab;font-size:10px}.axis-title{fill:#c7d0d7;font-size:11px;font-weight:700}.cross{stroke:#8996a0;stroke-width:1;stroke-dasharray:3 3}.tipbox{fill:#111a22;stroke:#46545f}.ranges{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.range{border:1px solid var(--b);background:transparent;color:var(--m);padding:6px 9px;border-radius:999px;cursor:pointer}.range.active{background:var(--a);color:#10150e;border-color:var(--a)}textarea{width:100%;min-height:70px;background:#0b1116;color:white;border:1px solid var(--b);border-radius:8px;padding:9px;margin:5px 0 10px}.feedback{white-space:pre-wrap;font-size:12px;line-height:1.55;margin-top:10px}.journal{margin-top:10px;display:grid;gap:8px}.entry{background:var(--p2);border-radius:9px;padding:10px;font-size:11px}.newsbadge{display:inline-block;padding:3px 6px;border:1px solid var(--b);border-radius:999px;margin-left:6px;font-size:9px;color:var(--m)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:16px}.stats{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>25M <b>MARKETS</b></h1><div class="sub">25-minute S&T macro training desk</div></div><button class="btn" id="refresh">↻ Refresh</button></div><div id="status" class="sub">시장 데이터 연결 중…</div><div id="grid" class="grid section"></div><div id="detail" class="panel detail"><div class="detail-head"><div><div id="dtitle" class="name"></div><div id="dsub" class="sub"></div></div><button class="btn secondary" id="closeDetail">닫기</button></div><div class="ranges"><button class="range active" data-days="30">1M</button><button class="range" data-days="90">3M</button><button class="range" data-days="180">6M</button><button class="range" data-days="365">1Y</button></div><div class="stats"><div class="stat"><span class="src">현재값</span><b id="sLatest">—</b></div><div class="stat"><span class="src">기간 고점</span><b id="sHigh">—</b></div><div class="stat"><span class="src">기간 저점</span><b id="sLow">—</b></div><div class="stat"><span class="src">기간 변화</span><b id="sChange">—</b></div></div><div class="chart-wrap"><div id="chart" class="chart"></div></div><div class="sub" id="axisHelp" style="margin-top:7px"></div><h2 style="margin-top:18px">관련 뉴스 <span id="assetNewsMeta" class="newsbadge"></span></h2><div id="assetNews" class="news"></div></div><div class="two section"><section><h2>Live News Radar <span id="newsMeta" class="newsbadge"></span></h2><div class="panel"><div id="news" class="news">뉴스 연결 중…</div></div></section><section><h2>Cause → Price</h2><div class="panel"><div class="src">① Event / Surprise</div><textarea id="event"></textarea><div class="src">② Market expectation / pricing</div><textarea id="expectation"></textarea><div class="src">③ Asset reaction</div><textarea id="reaction"></textarea><div class="src">④ Why / My reasoning</div><textarea id="reasoning"></textarea><div class="src">⑤ My View / Next catalyst</div><textarea id="view"></textarea><button class="btn" id="ai">AI 피드백 받기</button><button class="btn" id="save" style="margin-left:6px">Journal 저장</button><div id="feedback" class="feedback"></div></div></section></div><section class="section"><h2>Market Journal</h2><div id="journal" class="journal"></div></section></div><script>const $=s=>document.querySelector(s);let items=[],selectedId=null,days=30;const qmap={us2y:'"US 2-year Treasury" OR "Federal Reserve"',us10y:'"US 10-year Treasury" OR "Treasury yields"',kr3y:'"Bank of Korea" OR "Korean bonds"',kr10y:'"South Korea 10-year bond" OR "Korean bonds"',usdkrw:'"Korean won" OR "USD KRW"',usd:'"US dollar" OR "dollar index"',sp500:'"S&P 500" OR "US stocks"',nasdaq:'Nasdaq OR "technology stocks"',brent:'"Brent crude" OR "oil prices"',vix:'VIX OR "market volatility"'};const esc=s=>String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));function fmt(x,id){return Number(x).toLocaleString('en-US',{minimumFractionDigits:id==='usdkrw'?1:2,maximumFractionDigits:id==='usdkrw'?1:2})}function unitVal(a,v){return (a.unit==='$'?'$':'')+fmt(v,a.id)+(a.unit==='%'?'%':'')}async function markets(){try{let r=await fetch('/api/markets'),j=await r.json();items=j.items;$('#status').textContent=`${items.filter(x=>x.ok).length}/${items.length} sources connected · ${new Date(j.updatedAt).toLocaleTimeString()}`;$('#grid').innerHTML=items.map(x=>`<button class="card ${selectedId===x.id?'selected':''}" data-id="${x.id}"><div class="name">${x.label}</div><div class="note">${x.note} · ${x.source}</div><div class="val">${x.ok?unitVal(x,x.value):'—'}</div><div class="chg ${x.pct>0?'up':'down'}">${x.ok?(x.pct>0?'+':'')+x.pct.toFixed(2)+'%':'연결 실패'}</div></button>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>detail(c.dataset.id));if(selectedId)detail(selectedId,false)}catch(e){$('#status').textContent='시장 데이터 연결 실패: '+e.message}}function pickSeries(a){let all=a.series||[];if(!all.length)return[];let cut=Date.now()-days*86400000,d=all.filter(x=>Date.parse(x.d)>=cut);return d.length>1?d:all.slice(-Math.min(all.length,days))}function detail(id,scroll=true){let a=items.find(x=>x.id===id);if(!a)return;selectedId=id;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('selected',c.dataset.id===id));$('#detail').classList.add('show');$('#dtitle').textContent=a.label;$('#dsub').textContent=a.note+' · '+(a.source||'');renderChart(a);assetNews(a);if(scroll)$('#detail').scrollIntoView({behavior:'smooth',block:'start'})}function renderChart(a){let d=pickSeries(a);if(d.length<2){$('#chart').innerHTML='<div class="sub" style="padding:20px">시계열 없음</div>';return}let vals=d.map(x=>x.v),hi=Math.max(...vals),lo=Math.min(...vals),first=d[0].v,last=d.at(-1).v,pc=(last-first)/first*100;$('#sLatest').textContent=unitVal(a,last);$('#sHigh').textContent=unitVal(a,hi);$('#sLow').textContent=unitVal(a,lo);$('#sChange').textContent=(pc>0?'+':'')+pc.toFixed(2)+'%';$('#sChange').className=pc>0?'up':pc<0?'down':'';$('#axisHelp').textContent=`세로축: ${a.axis||a.unit||'Value'} · 가로축: 시간(Date) · 마우스를 차트 위에 올리면 날짜와 정확한 수치를 확인할 수 있어.`;let w=940,h=330,p={l:70,r:22,t:18,b:50},iw=w-p.l-p.r,ih=h-p.t-p.b,min=lo,max=hi,rg=max-min||1,pts=d.map((x,i)=>({x:p.l+i/(d.length-1)*iw,y:p.t+ih*(1-(x.v-min)/rg),...x})),path=pts.map((q,i)=>(i?'L':'M')+q.x.toFixed(1)+','+q.y.toFixed(1)).join(' '),grid='';for(let i=0;i<5;i++){let y=p.t+i/4*ih,val=max-i/4*rg;grid+=`<line class="gridline" x1="${p.l}" x2="${w-p.r}" y1="${y}" y2="${y}"/><text class="axis" text-anchor="end" x="${p.l-8}" y="${y+3}">${fmt(val,a.id)}</text>`}for(let i=0;i<5;i++){let idx=Math.round(i/4*(d.length-1)),x=p.l+i/4*iw,label=d[idx].d;grid+=`<line class="gridline" x1="${x}" x2="${x}" y1="${p.t}" y2="${p.t+ih}"/><text class="axis" text-anchor="middle" x="${x}" y="${h-26}">${label.slice(5)}</text>`}$('#chart').innerHTML=`<svg id="csvg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${grid}<text class="axis-title" transform="rotate(-90)" text-anchor="middle" x="-${p.t+ih/2}" y="16">${esc(a.axis||'Value')}</text><text class="axis-title" text-anchor="middle" x="${p.l+iw/2}" y="${h-7}">Time / Date</text><path class="area" d="${path} L${pts.at(-1).x},${p.t+ih} L${pts[0].x},${p.t+ih}Z"/><path class="line" d="${path}"/><line id="cx" class="cross" style="display:none" y1="${p.t}" y2="${p.t+ih}"/><circle id="dot" r="4" fill="var(--a)" style="display:none"/><g id="tip" style="display:none"><rect class="tipbox" width="145" height="42" rx="6"/><text id="td" class="axis" x="8" y="15"></text><text id="tv" class="axis-title" x="8" y="32"></text></g></svg>`;let svg=$('#csvg'),cx=$('#cx'),dot=$('#dot'),tip=$('#tip'),td=$('#td'),tv=$('#tv');svg.addEventListener('pointermove',e=>{let r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*w,idx=Math.max(0,Math.min(d.length-1,Math.round((px-p.l)/iw*(d.length-1)))),pt=pts[idx];cx.style.display=dot.style.display=tip.style.display='';cx.setAttribute('x1',pt.x);cx.setAttribute('x2',pt.x);dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);let tx=pt.x+10;if(tx+145>w)tx=pt.x-155;tip.setAttribute('transform',`translate(${tx},${Math.max(5,pt.y-50)})`);td.textContent=pt.d;tv.textContent=unitVal(a,pt.v)});svg.addEventListener('pointerleave',()=>{cx.style.display=dot.style.display=tip.style.display='none'})}document.querySelectorAll('.range').forEach(b=>b.onclick=()=>{document.querySelectorAll('.range').forEach(x=>x.classList.remove('active'));b.classList.add('active');days=Number(b.dataset.days);let a=items.find(x=>x.id===selectedId);if(a)renderChart(a)});$('#closeDetail').onclick=()=>{$('#detail').classList.remove('show');selectedId=null;document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'))};function newsHtml(a){return(a||[]).map(x=>`<div class="item"><a target="_blank" rel="noreferrer" href="${esc(x.url)}">${esc(x.title)}</a><div class="src">${esc(x.source)} · ${x.date?new Date(x.date).toLocaleString():''}</div></div>`).join('')||'<div class="sub">최근 뉴스 없음</div>'}async function news(q=''){try{let r=await fetch('/api/news'+(q?'?asset='+encodeURIComponent(q):'')),j=await r.json();if(!j.ok)throw Error(j.error);$('#news').innerHTML=newsHtml(j.articles);$('#newsMeta').textContent=(j.provider||'News')+' · '+j.articles.length+'건'}catch(e){$('#news').textContent='뉴스 연결 실패: '+e.message;$('#newsMeta').textContent='연결 실패'}}async function assetNews(a){try{$('#assetNews').innerHTML='<div class="sub">관련 뉴스 불러오는 중…</div>';let r=await fetch('/api/news?asset='+encodeURIComponent(qmap[a.id]||a.label)),j=await r.json();if(!j.ok)throw Error(j.error);$('#assetNews').innerHTML=newsHtml(j.articles);$('#assetNewsMeta').textContent=(j.provider||'News')+' · '+j.articles.length+'건'}catch(e){$('#assetNews').textContent='관련 뉴스 연결 실패: '+e.message;$('#assetNewsMeta').textContent='연결 실패'}}function snapshot(){return items.filter(x=>x.ok).map(x=>`${x.label}: ${x.value} (${x.pct.toFixed(2)}%)`).join('\n')}$('#ai').onclick=async()=>{$('#feedback').textContent='피드백 생성 중…';try{let body={event:$('#event').value,expectation:$('#expectation').value,reaction:$('#reaction').value,reasoning:$('#reasoning').value,view:$('#view').value,snapshot:snapshot()},r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!j.ok)throw Error(j.error);$('#feedback').textContent=j.text}catch(e){$('#feedback').textContent='AI 연결 필요: '+e.message}};function loadJournal(){let a=JSON.parse(localStorage.getItem('25m-journal')||'[]');$('#journal').innerHTML=a.map(x=>`<div class="entry"><b>${esc(x.date)}</b><br>${esc(x.event)}<br><span class="src">${esc(x.reasoning)}</span></div>`).join('')||'<div class="sub">아직 저장된 기록이 없습니다.</div>'}$('#save').onclick=()=>{let a=JSON.parse(localStorage.getItem('25m-journal')||'[]');a.unshift({date:new Date().toLocaleString(),event:$('#event').value,reasoning:$('#reasoning').value});localStorage.setItem('25m-journal',JSON.stringify(a));loadJournal()};$('#refresh').onclick=()=>{markets();news()};markets();news();loadJournal();</script></body></html>
